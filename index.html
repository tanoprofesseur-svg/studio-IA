<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio IA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0a1f">
<title>Studio Prompt Cinéma IA</title>
<style>
:root{--bg:#0f0a1f;--card:#1a1230;--ink:#f1ecff;--mut:#a99fc8;--acc:#d7ff3a;--pink:#ff4fa3;--bd:#33264f;--in:#120c24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ff;--card:#fff;--ink:#1b1233;--mut:#5d5480;--pink:#c4157a;--bd:#d9d0f0;--in:#f1ecfb}}
:root[data-theme="dark"]{--bg:#0f0a1f;--card:#1a1230;--ink:#f1ecff;--mut:#a99fc8;--pink:#ff4fa3;--bd:#33264f;--in:#120c24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:1fr;min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;border-bottom:1px solid var(--bd)}
nav b{display:none}
nav button{white-space:nowrap;background:none;border:1px solid transparent;color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--card);border-color:var(--pink)}
main{padding:14px;max-width:960px;width:100%}
@media(min-width:800px){.app{grid-template-columns:230px 1fr}nav{flex-direction:column;border:0;border-right:1px solid var(--bd);padding:18px 12px}nav b{display:block;margin:0 8px 14px;line-height:1.2}nav b span{color:var(--pink)}main{padding:24px}}
h1{margin:0 0 4px;font-size:26px}h2{font-size:17px;margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.hero{background:linear-gradient(135deg,#1a1230,#3a1a52);border-color:#5b4a85;color:#f1ecff}.hero .g{color:#f1ecff;border-color:#6b5a95}.hero .r{color:#ff6fb5;border-color:#ff6fb5}.hero h1{color:#fff}
.hero p{color:#cfc6ea}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid.g4{grid-template-columns:repeat(4,1fr)}.grid.g3{grid-template-columns:repeat(3,1fr)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.stat{font-size:28px;font-weight:700}.stat small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
button.b,.b{background:var(--acc);color:#1a1a00;border:1px solid rgba(26,26,0,.45);border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button.r{color:var(--pink);border-color:var(--pink)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0}
input,textarea,select{display:block;width:100%;margin-top:4px;background:var(--in);color:var(--ink);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;font-size:15px}
textarea{min-height:76px;resize:vertical}
pre{white-space:pre-wrap;word-break:break-word;background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:4px 0 8px;font:13px/1.45 ui-monospace,Menlo,monospace}
.tag{font-size:12px;color:var(--pink);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 10px 4px 0;font-size:14px;color:var(--ink)}.chk input{width:auto;margin:0}
.muted{color:var(--mut)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#dlg>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;width:100%;max-width:640px}
#dlg textarea{min-height:260px;font:12px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="dlg"><div><div class="tag" id="dt"></div><textarea id="dta"></textarea><div class="row"><button class="b" id="dcopy">Copier</button><button class="g" id="dsave">Télécharger</button><button class="b" id="dimp" style="display:none">Importer</button><button class="g" id="dclose">Fermer</button></div><div class="muted" id="dmsg"></div></div></div>
<script>
const NAV={all:"📁 Mes projets",dash:"Tableau de bord",proj:"Projet",story:"Histoire",chars:"Personnages",scenes:"Scènes",pub:"Publication",gem:"✨ IA",guide:"Guide"};
const SH=[["Gros plan","Close-up"],["Plan moyen","Medium shot"],["Plan large","Wide shot"],["Contre-plongée","Low angle shot"],["Plongée","High angle shot"]];
const MV=[["Caméra fixe","Static camera"],["Travelling avant lent","Slow dolly in"],["Panoramique","Pan"],["Caméra épaule","Handheld camera"],["Zoom lent","Slow zoom"]];
const T={fr:{port:"Portrait de référence de",yrs:"ans",outfit:"Tenue",bg:"Fond blanc uni, éclairage studio doux, plan buste, regard caméra, expression neutre, ultra détaillé",style:"Style",ds:"cinéma réaliste",light:"Lumière",mood:"Ambiance",chars:"Personnages",anim:"Animation de",sec:"secondes",cam:"Mouvement de caméra",keep:"Continuité parfaite des personnages, mouvements naturels, sans coupe",fmt:"Format",neg:"flou, mains déformées, doigts en trop, texte, filigrane, logo, visage asymétrique, basse résolution, arrière-plan chargé",cta:"Regarde jusqu’au bout."},
en:{port:"Reference portrait of",yrs:"years old",outfit:"Outfit",bg:"Plain white background, soft studio lighting, bust shot, looking at camera, neutral expression, ultra detailed",style:"Style",ds:"cinematic realism",light:"Lighting",mood:"Mood",chars:"Characters",anim:"Animation of",sec:"seconds",cam:"Camera movement",keep:"Perfect character consistency, natural motion, no cuts",fmt:"Aspect ratio",neg:"blurry, deformed hands, extra fingers, text, watermark, logo, asymmetrical face, low resolution, cluttered background",cta:"Watch until the end."}};
const def=()=>({lang:"fr",p:{title:"",genre:"",style:"",ratio:"9:16",dur:8},story:{log:"",a1:"",a2:"",a3:""},chars:[],scenes:[]});
const cl=(n,m)=>{n=Math.floor(+n);return n>=0&&n<m?n:0};
const okIm=v=>/^data:image\/[a-z+.-]+;base64,[A-Za-z0-9+\/=]+$/i.test(v||"");
function norm(o){o=Object.assign(def(),o&&typeof o==="object"?o:{});o.p=Object.assign(def().p,o.p&&typeof o.p==="object"?o.p:{});o.story=Object.assign(def().story,o.story&&typeof o.story==="object"?o.story:{});
o.chars=(Array.isArray(o.chars)?o.chars:[]).filter(c=>c&&typeof c==="object");o.scenes=(Array.isArray(o.scenes)?o.scenes:[]).filter(s=>s&&typeof s==="object");
if(!["9:16","16:9","1:1","4:5"].includes(o.p.ratio))o.p.ratio="9:16";
const n=parseInt(o.p.dur,10);o.p.dur=n>0&&n<=60?n:8;
if(o.lang!=="fr"&&o.lang!=="en")o.lang="fr";
o.chars.forEach(c=>{c.sx=cl(c.sx,3);c.pt=cl(c.pt,3);c.tb=cl(c.tb,8)});
o.scenes.forEach(s=>{s.shot=cl(s.shot,5);s.mv=cl(s.mv,5);s.ch=(Array.isArray(s.ch)?s.ch:[]).map(Number).filter(i=>Number.isInteger(i)&&i>=0&&i<o.chars.length);s.dia=(Array.isArray(s.dia)?s.dia:[]).filter(l=>l&&typeof l==="object")});
return o}
let X=null,S;try{X=JSON.parse(localStorage.getItem("epc_idx"))}catch(e){}
const loadP=id=>{try{return norm(JSON.parse(localStorage.getItem("epc_p_"+id)))}catch(e){return def()}};
const wx=()=>{try{localStorage.setItem("epc_idx",JSON.stringify(X))}catch(e){}};
if(!X||!X.list||!X.list.length){let o=null;try{o=JSON.parse(localStorage.getItem("epc"))}catch(e){}X={cur:"p1",list:[{id:"p1",name:(o&&o.p&&o.p.title)||"Projet 1"}]};S=norm(o)}else{if(!X.list.find(q=>q.id===X.cur))X.cur=X.list[0].id;S=loadP(X.cur)}
let view="dash",arm=false;
const save=()=>{try{const q=X.list.find(q=>q.id===X.cur);if(q&&S.p&&S.p.title)q.name=S.p.title;localStorage.setItem("epc_p_"+X.cur,JSON.stringify(S));localStorage.setItem("epc_idx",JSON.stringify(X))}catch(e){}};save();
const x=()=>T[S.lang],L=()=>S.lang==="fr"?0:1,sty=()=>S.p.style||x().ds;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(l,k,v,ph,ta)=>`<label>${l}${ta?`<textarea data-k="${k}" placeholder="${ph||""}">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}" placeholder="${ph||""}">`}</label>`;
const out=(l,t)=>`<div class="tag">${l}</div><pre>${esc(t)}</pre><button class="g" data-a="copy">Copier</button>`;
const charP=c=>`${x().port} ${c.name||"…"}${c.age?`, ${c.age} ${x().yrs}`:""}${c.desc?`, ${c.desc}`:""}. ${c.outfit?x().outfit+": "+c.outfit+". ":""}${x().bg}. ${x().style}: ${sty()}.`;
const names=s=>(s.ch||[]).map(i=>S.chars[i]).filter(Boolean).map(c=>c.name+(c.desc?" ("+c.desc+")":"")).join("; ");
const imgP=s=>`${SH[s.shot||0][L()]}, ${s.set||"…"}. ${s.act||""} ${names(s)?x().chars+": "+names(s)+". ":""}${x().light}: ${s.light||"…"}. ${x().mood}: ${s.mood||"…"}. ${x().style}: ${sty()}. ${x().fmt} ${S.p.ratio}.`;
Object.assign(T.fr,{spk:"dit",ans:"répond",dlg:"Dialogue (une seule personne parle à la fois, sans chevauchement, débit rapide mais naturel)",vc:"Chaque voix reste constante et nettement différente de celle des autres personnages"});
Object.assign(T.en,{spk:"says",ans:"replies",dlg:"Dialogue (only one person speaks at a time, no overlap, fast but natural pace)",vc:"Each voice stays consistent and clearly different from the other characters"});
const SX=[["voix féminine","female voice"],["voix masculine","male voice"],["voix androgyne","androgynous voice"]];
const PT=[["grave","low-pitched"],["médiane","mid-pitched"],["aiguë","high-pitched"]];
const TB=[["rauque","raspy"],["chaleureuse","warm"],["nasillarde","nasal"],["soyeuse","silky"],["cassante","sharp"],["voilée","breathy"],["posée","calm and measured"],["éraillée","gravelly"]];
const voiceTxt=c=>{const l=L(),a=String(c.age||"").trim();return `${SX[c.sx||0][l]} ${PT[c.pt||0][l]}, ${TB[c.tb||0][l]}${a?`, ${a} ${x().yrs}`:""}${c.ac?`, accent${l?": ":" "}${c.ac}`:""}`};
const voiceP=c=>`${c.name||"…"} : ${voiceTxt(c)}. ${S.lang==="fr"?"Débit rapide et naturel, timbre constant.":"Fast, natural pace, consistent timbre."}`;
const clashW=c=>{const o=S.chars.find(d=>d!==c&&(((d.sx||0)===(c.sx||0)&&(d.pt||0)===(c.pt||0))||(d.tb||0)===(c.tb||0)));return o?`<div class="tag">⚠️ Voix trop proche de ${esc(o.name||"?")} : change la hauteur ou le timbre</div>`:""};
function dedupVoices(){const seen=new Set(),tbs=new Set();S.chars.forEach(c=>{c.sx=cl(c.sx,3);c.pt=cl(c.pt,3);c.tb=cl(c.tb,8);const k=()=>c.sx+"-"+c.pt;
for(let p=0;p<3&&seen.has(k());p++)c.pt=p;seen.add(k());for(let t=0;t<8&&tbs.has(c.tb);t++)c.tb=(c.tb+1)%8;tbs.add(c.tb)})}
function autoVoices(){const C=[[1,0],[0,2],[1,2],[0,0],[1,1],[0,1],[2,1],[2,0],[2,2]];S.chars.forEach((c,i)=>{const v=C[i%9];c.sx=v[0];c.pt=v[1];c.tb=i%8});save()}
const mw=()=>Math.floor((+S.p.dur||8)*2.8);
const dw=s=>(s.dia||[]).map(l=>(l.text||"").trim().split(/\s+/).filter(Boolean).length).reduce((a,b)=>a+b,0);
const dStat=s=>dw(s)?`<div class="${dw(s)>mw()?"tag":"muted"}">Dialogue : ${dw(s)}/${mw()} mots ${dw(s)>mw()?"⚠️ trop long pour "+esc(S.p.dur)+" s":"✓"}</div>`:"";
function fixDia(s){const ch=(s.ch||[]).filter(j=>S.chars[j]);let d=(s.dia||[]).filter(l=>l.text&&S.chars[l.who]).slice(0,2);d.forEach(l=>{if(!ch.includes(l.who))ch.push(l.who)});s.ch=ch;
if(d.length===2&&d[0].who===d[1].who){const o=ch.find(j=>j!==d[0].who);if(o!==undefined)d[1].who=o;else d.pop()}s.dia=d}
async function shorten(){try{const bad=S.scenes.map((s,i)=>[i,s]).filter(([i,s])=>dw(s)>mw());if(!bad.length)return;
const r=await gem(`Raccourcis chaque dialogue à ${mw()} mots maximum au total, ton rapide et percutant, en gardant le sens, la langue et le locuteur (who) de chaque réplique. JSON : {"d":[[{"who":0,"text":""}]]} (un tableau par scène, dans le même ordre). ${JSON.stringify(bad.map(([i,s])=>s.dia))}`);
bad.forEach(([i],k)=>{const d=(r.d||[])[k];if(Array.isArray(d)){S.scenes[i].dia=d.map(l=>({who:Number(l.who),text:String(l.text||"")}));fixDia(S.scenes[i])}})}catch(e){}}
const sel=(l,k,o,v)=>`<label>${l}<select data-k="${k}">${o.map((q,j)=>`<option value="${j}" ${j==(v||0)?"selected":""}>${q[0]}</option>`).join("")}</select></label>`;
function dEd(s,i){s.dia=s.dia||[];while(s.dia.length<2)s.dia.push({who:"",text:""});
const pool=(s.ch&&s.ch.length?s.ch:S.chars.map((_,j)=>j)).filter(j=>S.chars[j]);
return `<div class="muted" style="font-size:12px;margin-top:8px">🎙️ Dialogue : une personne parle, l’autre répond ensuite</div>`+[0,1].map(n=>`<div class="two"><label>${n?"Répond":"Parle"}<select data-k="scenes.${i}.dia.${n}.who"><option value="">—</option>${pool.map(j=>`<option value="${j}" ${s.dia[n].who===j?"selected":""}>${esc(S.chars[j].name||"?")}</option>`).join("")}</select></label>${f("Réplique",`scenes.${i}.dia.${n}.text`,s.dia[n].text,"")}</div>`).join("")}
const aniP=s=>{const D=+S.p.dur||8,d=(s.dia||[]).filter(l=>l.text&&S.chars[l.who]),w=d.map(l=>l.text.trim().split(/\s+/).length),tot=w.reduce((a,b)=>a+b,0)||1;let t=0;
const seg=d.map((l,n)=>{const a=t;t=n===d.length-1?D:Math.round((t+D*w[n]/tot)*10)/10;const c=S.chars[l.who];return `${a}–${t} s : ${c.name} (${voiceTxt(c)}) ${n&&d[n-1].who!==l.who?x().ans:x().spk} « ${l.text} »`}).join(" ; ");
return `${x().anim} ${D} ${x().sec}: ${s.act||"…"}.${d.length?` ${x().dlg} : ${seg}. ${x().vc}.`:""} ${x().cam}: ${MV[s.mv||0][L()]}. ${x().keep}.`};
const charOut=c=>out("Prompt portrait",charP(c))+out("Prompt voix",voiceP(c))+clashW(c)+out("Negative prompt",x().neg);
const sceOut=s=>dStat(s)+out("Prompt image",imgP(s))+out("Prompt animation",aniP(s))+out("Negative prompt",x().neg);
const OUT={chars:charOut,scenes:sceOut};
function pubT(){if(S.pub)return S.pub;const p=S.p,w=(p.genre+" "+p.style).toLowerCase().split(/[^a-zà-ÿ]+/).filter(w=>w.length>3).slice(0,4).map(w=>"#"+w);
return{t:p.title||"…",d:(S.story.log||"")+" "+x().cta,h:[...w,"#cinemaia","#courtmetrage","#ia","#shorts"].join(" ")}}
const dl=s=>(s.dia||[]).filter(l=>l.text&&S.chars[l.who]).map(l=>`- ${S.chars[l.who].name} : « ${l.text} »\n`).join("");
function md(){const p=S.p;let o=`# ${p.title||"Projet"}\n\n${p.genre} · ${sty()} · ${p.ratio} · ${p.dur} s/scène · prompts ${S.lang.toUpperCase()}\n\n## Histoire\n${S.story.log}\n\n1. ${S.story.a1}\n2. ${S.story.a2}\n3. ${S.story.a3}\n\n## Personnages\n`;
S.chars.forEach(c=>{o+=`### ${c.name}\n**Portrait :** ${charP(c)}\n\n**Voix :** ${voiceP(c)}\n\n`});
o+=`**Negative prompt :** ${x().neg}\n\n## Scènes\n`;
S.scenes.forEach((s,i)=>{o+=`### Scène ${i+1}${s.t?" : "+s.t:""}\n- Plan : ${SH[s.shot||0][L()]} · Caméra : ${MV[s.mv||0][L()]}\n${dl(s)?"- Dialogue :\n"+dl(s):""}\n**Image :** ${imgP(s)}\n\n**Animation :** ${aniP(s)}\n\n`});
if(S.pub){const q=S.pub;o+=`## Publication\n**Titre :** ${q.t}\n\n${q.d}\n\n${q.h}\n`}return o}
function script(){let o=`# ${S.p.title||"Projet"} : script voix et dialogues\n\n## Voix des personnages\n`+S.chars.map(c=>`- **${c.name||"?"}** : ${voiceTxt(c)}`).join("\n")+"\n\n";
S.scenes.forEach((q,i)=>{const d=(q.dia||[]).filter(l=>l.text&&S.chars[l.who]);if(!d.length)return;o+=`## Scène ${i+1}${q.t?" : "+q.t:""} (${S.p.dur} s, ${dw(q)} mots)\n`+d.map(l=>`${S.chars[l.who].name} : ${l.text}`).join("\n")+"\n\n"});return o}
const V={
all(){return `<h1>Mes projets</h1><div class="card"><label>Nouveau projet<input id="npn" placeholder="Titre du projet"></label><button class="b" data-a="np">+ Créer</button></div>`+X.list.map(q=>{let d=q.id===X.cur?S:null;if(!d){try{d=JSON.parse(localStorage.getItem("epc_p_"+q.id))}catch(e){}}d=d||{};return `<div class="card"><b>${esc(q.name||"Sans titre")}</b>${q.id===X.cur?' <span class="tag">ouvert</span>':""}<div class="muted">${(d.chars||[]).length} personnages · ${(d.scenes||[]).length} scènes${d.p&&d.p.genre?" · "+esc(d.p.genre):""}</div><div class="row"><button class="b" data-a="open" data-i="${q.id}">Ouvrir</button><button class="g" data-a="dup" data-i="${q.id}">Dupliquer</button><button class="g r" data-a="delp" data-i="${q.id}">Supprimer</button></div></div>`}).join("")},
dash(){const p=S.p;return `<div class="card hero"><div class="tag" style="color:#d7ff3a">Ton atelier de production</div><h1>Donne vie à tes histoires.</h1><p>Prépare tes personnages, structure ton scénario et génère des prompts (français ou anglais, avec negative prompts) prêts pour Nano Banana, Google Flow, Grok ou Meta AI.</p><label style="color:#cfc6ea">✨ Ton idée<textarea data-k="idea" placeholder="Ex. : un pasteur qui consulte des féticheurs pour faire prospérer son église…">${esc(S.idea)}</textarea></label><div class="row"><button class="b" data-a="g0">🚀 Tout générer depuis mon idée</button></div><div id="gst" style="color:#cfc6ea;font-size:13px"></div><div class="row"><button class="g" data-a="nav" data-i="proj" style="color:#f1ecff">+ Configurer à la main</button><button class="g" data-a="md" style="color:#f1ecff">Exporter (.md)</button><button class="g" data-a="dsc" style="color:#f1ecff">Script voix</button><button class="g r" data-a="reset">Réinitialiser</button></div></div>
<div class="grid g4"><div class="card stat">${p.title?1:0}<small>Projet configuré</small></div><div class="card stat">${S.chars.length}<small>Personnages</small></div><div class="card stat">${S.scenes.length}<small>Scènes</small></div><div class="card stat">${S.chars.length+S.scenes.length*2}<small>Prompts disponibles</small></div></div>
<h2>Projet en cours</h2><div class="card">${p.title?`<b>${esc(p.title)}</b><div class="muted">${esc(p.genre)} · ${esc(sty())} · ${esc(p.ratio)} · ${esc(p.dur)}s/scène</div>`:`<span class="muted">Aucun projet pour l’instant.</span>`}</div>
<h2>Accès rapide</h2><div class="grid g3"><div class="card"><b>👥 Personnages</b><p class="muted">Portraits de référence sur fond blanc.</p><button class="g" data-a="nav" data-i="chars">Gérer</button></div><div class="card"><b>🎥 Scènes</b><p class="muted">Prompts image, animation et negative.</p><button class="g" data-a="nav" data-i="scenes">Préparer</button></div><div class="card"><b>📣 Publication</b><p class="muted">Titre, description, hashtags.</p><button class="g" data-a="nav" data-i="pub">Préparer</button></div></div>`},
proj(){const p=S.p;return `<h1>Départ / Projet</h1>${f("Titre","p.title",p.title,"La Dîme Noire")}${f("Genre","p.genre",p.genre,"thriller, drame social…")}${f("Style visuel","p.style",p.style,"cinéma réaliste, 3D Pixar, noir et blanc…")}<div class="two"><label>Format<select data-k="p.ratio">${["9:16","16:9","1:1","4:5"].map(r=>`<option ${r==p.ratio?"selected":""}>${r}</option>`).join("")}</select></label>${f("Durée par scène (s)","p.dur",p.dur)}</div><button class="b" data-a="nav" data-i="story">Continuer vers l’histoire →</button>`},

function loadIM(){idb.then(d=>{if(!d)return;const lg=[],q=d.transaction("i").objectStore("i").openCursor();q.onsuccess=()=>{const c=q.result;if(c){if(/^[cs]\d+$/.test(c.key)){IM[c.key]=c.value;lg.push(c.key)}else if(c.key===PID())Object.assign(IM,c.value);else if(c.key===PID()+":v")Object.assign(VM,c.value);c.continue()}else{if(lg.length){persist();const o=d.transaction("i","readwrite").objectStore("i");lg.forEach(k=>o.delete(k))}render()}}})}

async function genImg(key){return R(async()=>{const t=key[0],i=+key.slice(1),pv=K("prov")||"gemini",ch=t==="c";
const pr=(ch?charP(S.chars[i]):imgP(S.scenes[i]))+" "+(S.lang==="fr"?"À éviter : ":"Avoid: ")+x().neg+".";
if(pv==="openai"){const ok=K("okey");if(!ok)throw NK("Ajoute ta clé OpenAI dans l’onglet IA.");
const j=await API("https://api.openai.com/v1/images/generations",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+ok},body:JSON.stringify({model:K("oimg")||"gpt-image-1",prompt:pr,size:ch?"1024x1024":({"16:9":"1536x1024","1:1":"1024x1024"}[S.p.ratio]||"1024x1536")})});
IM[key]="data:image/png;base64,"+j.data[0].b64_json}
else{const k=K("key");if(!k)throw NK("Ajoute ta clé Gemini dans l’onglet IA : la génération d’images en a besoin.");
const parts=[{text:pr}];
if(!ch)(S.scenes[i].ch||[]).forEach(j=>{const m=(IM["c"+j]||"").match(/^data:(.*?);base64,(.*)$/);if(m)parts.push({inlineData:{mimeType:m[1],data:m[2]}})});
if(parts.length>1)parts[0].text=(S.lang==="fr"?"Utilise les images jointes comme références exactes des personnages (visages, tenues). ":"Use the attached images as exact character references (faces, outfits). ")+pr;
const j=await gcall("img",{contents:[{parts}],generationConfig:{imageConfig:{aspectRatio:ch?"1:1":S.p.ratio}}});
const c=(j.candidates||[])[0],pt=(c&&c.content&&c.content.parts)||[],d=(pt.find(q=>q.inlineData)||{}).inlineData;
if(!d){const why=(j.promptFeedback&&j.promptFeedback.blockReason)||(c&&c.finishReason)||"",tx=pt.map(q=>q.text||"").join(" ").slice(0,160);throw NK("Image refusée"+(why?" (motif : "+why+")":"")+(tx?" — "+tx:"")+". Reformule la scène en moins explicite puis réessaie.")}
IM[key]=`data:${d.mimeType||"image/png"};base64,${d.data}`}
persist();const el=document.querySelector(`[data-card="${ch?"chars":"scenes"}.${i}"] .im`);if(el)el.innerHTML=imb(key)})}

async function allImg(){let bad=0;const jobs=[...S.chars.map((_,i)=>"c"+i),...S.scenes.map((_,i)=>"s"+i)].filter(k=>!IM[k]);

async function translate(){if(!(S.chars.length||S.scenes.length||S.story.log))return;
const lg=S.lang==="fr"?"français":"anglais",d={p:{title:S.p.title,genre:S.p.genre,style:S.p.style},story:S.story,chars:S.chars.map(c=>({desc:c.desc,outfit:c.outfit,ac:c.ac||""})),scenes:S.scenes.map(c=>({t:c.t,set:c.set,act:c.act,light:c.light,mood:c.mood,dia:(c.dia||[]).map(l=>l.text)})),pub:S.pub||null};
say("Traduction en cours…");
try{const r=await gem(`Traduis en ${lg} toutes les valeurs texte de ce JSON, sans changer les clés ni la structure. Réponds uniquement en JSON : ${JSON.stringify(d)}`);
if(r.p)Object.assign(S.p,r.p);if(r.story)Object.assign(S.story,r.story);
(r.chars||[]).forEach((c,i)=>S.chars[i]&&Object.assign(S.chars[i],c));(r.scenes||[]).forEach((c,i)=>{const q=S.scenes[i];if(!q)return;const dd=c.dia;delete c.dia;Object.assign(q,c);if(Array.isArray(dd))(q.dia||[]).forEach((l,n)=>{if(typeof dd[n]==="string")l.text=dd[n]})});if(r.pub&&S.pub)S.pub=r.pub;

if(ks.length&&confirm("Inclure les "+ks.length+" vidéo(s) dans la sauvegarde ?\n\nOK = avec vidéos (fichier lourd)\nAnnuler = sans vidéos")){say("Préparation des vidéos…");try{for(const k of ks)vv[k]=await b2d(VM[k])}catch(e){Object.keys(vv).forEach(k=>delete vv[k])}}
const b=new Blob([JSON.stringify({S,IM,VM:vv})],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="studio-sauvegarde.json";document.body.appendChild(a);a.click();a.remove();say("Sauvegarde créée ✓ (vérifie tes téléchargements)");setTimeout(()=>say(""),4000)}
const rf=document.createElement("input");rf.type="file";rf.accept=".json,application/json";rf.style.display="none";document.body.appendChild(rf);
rf.onchange=async()=>{try{const o=JSON.parse(await rf.files[0].text());const q=o.S||o;newP((q.p&&q.p.title)||"Projet restauré");S=norm(q);Object.entries(o.IM||{}).forEach(([k,v])=>{if(/^[cs]\d+$/.test(k)&&okIm(v))IM[k]=v});for(const[k,v] of Object.entries(o.VM||{})){if(/^s\d+$/.test(k)&&/^data:video\/[a-z0-9.+-]+;base64,/i.test(v)){try{VM[k]=await(await fetch(v)).blob()}catch(_){}}}save();persist();persistV();render();say("Restauré dans un nouveau projet ✓")}catch(e){say("Fichier invalide")}rf.value="";setTimeout(()=>say(""),3000)};
function go(id){Object.keys(IM).forEach(k=>delete IM[k]);Object.keys(VM).forEach(k=>delete VM[k]);X.cur=id;S=loadP(id);wx();view="dash";render();loadIM()}
function sw(id){if(id===X.cur)return;save();go(id)}
function newP(name){save();const id="p"+Date.now().toString(36);X.list.push({id,name:name||"Projet "+(X.list.length+1)});X.cur=id;Object.keys(IM).forEach(k=>delete IM[k]);Object.keys(VM).forEach(k=>delete VM[k]);S=def();if(name)S.p.title=name;save();view="dash";render()}
function dup(id){let d=id===X.cur?S:null;if(!d){try{d=JSON.parse(localStorage.getItem("epc_p_"+id))}catch(e){}}if(!d)return;
const nid="p"+Date.now().toString(36),nm=((X.list.find(q=>q.id===id)||{}).name||"Projet")+" (copie)";d=JSON.parse(JSON.stringify(d));d.p=d.p||{};d.p.title=nm;
try{localStorage.setItem("epc_p_"+nid,JSON.stringify(d))}catch(e){}X.list.push({id:nid,name:nm});wx();
idb.then(db=>{if(!db)return;if(id===X.cur){const o=db.transaction("i","readwrite").objectStore("i");o.put({...IM},nid);if(Object.keys(VM).length)o.put({...VM},nid+":v")}else["",":v"].forEach(x=>{const q=db.transaction("i").objectStore("i").get(id+x);q.onsuccess=()=>{if(q.result)db.transaction("i","readwrite").objectStore("i").put(q.result,nid+x)}})});

X.list=X.list.filter(q=>q.id!==id);if(!X.list.length)X.list.push({id:"p"+Date.now().toString(36),name:"Projet 1"});
if(!X.list.find(q=>q.id===X.cur)){go(X.list[0].id);view="all";render()}else{wx();render()}}
const VM={},VU=new WeakMap(),sl=ms=>new Promise(r=>setTimeout(r,ms)),GB="https://generativelanguage.googleapis.com/v1beta";
const vurl=b=>{if(!VU.has(b))VU.set(b,URL.createObjectURL(b));return VU.get(b)};
const vb=k=>VM[k]?`<video controls playsinline style="width:100%;max-width:360px;border-radius:12px;margin:8px 0;display:block" src="${vurl(VM[k])}"></video><a download="${k}.mp4" href="${vurl(VM[k])}" style="display:inline-block;margin-bottom:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;color:var(--ink);text-decoration:none">Télécharger la vidéo</a>`:"";

async function genVid(key,label){const i=+key.slice(1),s=S.scenes[i],k=K("key");if(!k)throw NK("La vidéo utilise Veo (Gemini) : ajoute ta clé Gemini dans l’onglet IA.");
const m=(IM[key]||"").match(/^data:(.*?);base64,(.*)$/),rt=S.p.ratio==="16:9"?"16:9":"9:16",useImg=m&&(S.p.ratio==="16:9"||S.p.ratio==="9:16"),D=+S.p.dur||8,dd=[4,6,8].reduce((a,b)=>Math.abs(b-D)<Math.abs(a-D)?b:a);
if(!["16:9","9:16"].includes(S.p.ratio))say("Format "+S.p.ratio+" non géré par Veo : vidéo en 9:16.");
const pr=((useImg?"":imgP(s)+" ")+aniP(s)).replace(/[«»]/g,'"');
const go=mm=>API(`${GB}/models/${mm}:predictLongRunning`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},body:JSON.stringify({instances:[Object.assign({prompt:pr},useImg?{image:{bytesBase64Encoded:m[2],mimeType:m[1]}}:{})],parameters:{aspectRatio:rt,durationSeconds:dd,negativePrompt:x().neg}})});
let op;try{op=await go(K("gvid")||"veo-3.0-generate-001")}catch(e){if(!/no longer available|not found|not supported|404/i.test(e.message))throw e;
const j=await API(`${GB}/models?pageSize=200`,{headers:{"x-goog-api-key":k}}),n=j.models.filter(q=>(q.supportedGenerationMethods||[]).includes("predictLongRunning")).map(q=>q.name.replace("models/","")).filter(q=>/veo/.test(q)&&!/fast/.test(q)).sort();
if(!n.length)throw e;const mm=n[n.length-1];try{localStorage.setItem("epc_gvid",mm)}catch(_){}say("Modèle vidéo remplacé par "+mm);op=await go(mm)}
let o=op;for(let n=0;n<60&&!o.done;n++){await sl(10000);say(`${label||"Vidéo"} en cours… ${(n+1)*10} s`);o=await API(`${GB}/${op.name}`,{headers:{"x-goog-api-key":k}})}
if(!o.done)throw NK("La vidéo prend trop de temps : réessaie plus tard.");
if(o.error)throw NK(o.error.message||"Erreur Veo");
const g=(o.response||{}).generateVideoResponse||{},u=((g.generatedSamples||[])[0]||{}).video;
if(!u||!u.uri)throw NK("Vidéo refusée"+(g.raiMediaFilteredReasons?" : "+g.raiMediaFilteredReasons.join(" "):"")+". Reformule la scène (moins explicite).");
const link=u.uri+(u.uri.includes("?")?"&":"?")+"key="+k;
try{const r=await fetch(link);if(!r.ok)throw 0;VM[key]=await r.blob()}catch(e){throw Object.assign(NK("Vidéo générée mais téléchargement bloqué par le navigateur."),{link})}
persistV()}

async function gcall(kind,body){const k=K("key"),sk=kind==="img"?"gimg":"model",dm=kind==="img"?"gemini-2.5-flash-image":"gemini-2.5-flash";
